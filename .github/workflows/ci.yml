name: Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y gnupg git-crypt

      - name: Import GPG private key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # optionally set ownertrust if needed:
          # KEY_FPR=$(gpg --with-colons --fingerprint | awk -F: '/fpr/{print $10; exit}')
          # printf "%s:6:\n" "$KEY_FPR" | gpg --import-ownertrust

      - name: Unlock git-crypt
        run: git-crypt unlock

      - name: Verify decrypted files
        run: |
          ls -la src | head -n 20
          head -n 5 src/index.ts || true

      - name: Build & Deploy
        run: |
          npm ci
          npm run build
          ./deploy.sh
